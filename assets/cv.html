<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oluwatobi Fasipe — Executive CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #1B3A5C; --ink: #22262A; --muted: #5C646E; --line: #D8DFE6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #F1F3F6; color: var(--ink); font-family: "Inter", -apple-system, sans-serif; font-size: 13.5px; line-height: 1.5; }
    .toolbar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .sheet { max-width: 820px; margin: 24px auto 48px; background: #fff; padding: 44px 52px; box-shadow: 0 10px 34px rgba(0,0,0,0.08); }
    h1 { font-family: "Playfair Display", Georgia, serif; font-size: 28px; color: var(--navy); margin: 0 0 6px; }
    .contact { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
    h2 { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--navy); border-bottom: 1.5px solid var(--navy); padding-bottom: 4px; margin: 22px 0 10px; }
    .role-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; margin-top: 12px; }
    .role-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
    ul { margin: 0 0 10px; padding-left: 18px; }
    li { margin-bottom: 4px; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; margin: 0; padding: 0; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn" href="../index.html">← Back to Website Picker</a>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>
  <main class="sheet" id="cvRoot"></main>
  <script src="../shared/data.js"></script>
  <script>
    const D = window.TOBI_DATA;
    document.getElementById("cvRoot").innerHTML = `
      <h1>${D.profile.fullName}</h1>
      <div class="contact">Commercial &amp; Operations Leader · ${D.profile.location} · ${D.profile.visa} · ${D.profile.email} · ${D.profile.linkedinDisplay}</div>
      <h2>Executive Summary</h2>
      <p style="margin:0;">${D.profile.recruiterSummary}</p>
      <h2>Experience</h2>
      ${D.roles.map(r => `
        <div class="role-head"><span>${r.role} — ${r.company}</span><span style="font-weight:600;color:var(--muted);">${r.period}</span></div>
        <div class="role-sub">${r.location}</div>
        <ul>
          ${r.caseStudy.systemBuilt.map(x => `<li>${x}</li>`).join("")}
          ${r.caseStudy.outcomes.map(x => `<li>${x}</li>`).join("")}
        </ul>
      `).join("")}
      <h2>Selected Projects</h2>
      <ul>
        ${D.systemsBuilt.map(s => `<li><strong>${s.title} (${s.headlineMetric} ${s.headlineSub}):</strong> ${s.solution}</li>`).join("")}
      </ul>
      <h2>Credentials, Investing &amp; Education</h2>
      <ul>
        ${D.credentials.map(c => `<li><strong>${c.title}:</strong> ${c.body}</li>`).join("")}
      </ul>
    `;
  </script>
</body>
</html>
