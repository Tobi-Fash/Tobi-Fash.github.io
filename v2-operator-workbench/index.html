<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#141517" id="themeMeta" />
  <title>Tobi Fasipe — Operator Workbench</title>
  <meta name="description" content="Oluwatobi (Tobi) Fasipe — Senior Commercial & Operations Leader across Glovo, Chowdeck, Stitch, and Paystack. Interactive Impact Ledger, Systems Built, and Essays." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #141517;
      --sidebar: rgba(24, 25, 28, 0.86);
      --surface: #1C1E22;
      --surface-2: #23262B;
      --surface-hover: #292D34;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --ink: #F5F6F7;
      --ink-2: #C2C6CE;
      --muted: #848A95;
      --green: #00C29E;
      --green-soft: rgba(0, 194, 158, 0.14);
      --amber: #FFC244;
      --amber-soft: rgba(255, 194, 68, 0.15);
      --coral: #FF6B5E;
      --coral-soft: rgba(255, 107, 94, 0.15);
      --inspector-bg: rgba(24, 25, 28, 0.92);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      --display: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --radius: 14px;
    }

    html[data-theme="light"] {
      --bg: #F5F5F7;
      --sidebar: rgba(238, 238, 242, 0.82);
      --surface: #FFFFFF;
      --surface-2: #F0F0F3;
      --surface-hover: #E7E7EC;
      --border: rgba(22, 23, 23, 0.09);
      --border-strong: rgba(22, 23, 23, 0.18);
      --ink: #161717;
      --ink-2: #3F4247;
      --muted: #6C7078;
      --green: #008F72;
      --green-soft: rgba(0, 143, 114, 0.11);
      --amber: #A67100;
      --amber-soft: rgba(242, 184, 48, 0.20);
      --coral: #D63F34;
      --coral-soft: rgba(214, 63, 52, 0.11);
      --inspector-bg: rgba(255, 255, 255, 0.92);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      transition: background 240ms ease, color 240ms ease;
    }

    button, a, [role="button"] {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: inherit;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* Subtle ambient corner glows (simoskill-glovo-dashboard restrained) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(48vw 36vh at 0% 0%, rgba(0, 194, 158, 0.08), transparent 62%),
        radial-gradient(40vw 36vh at 100% 100%, rgba(255, 194, 68, 0.06), transparent 62%);
    }
    html[data-theme="light"] body::before { opacity: 0.4; }

    /* Native macOS 2-Pane / 3-Pane App Shell */
    .workbench {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 262px minmax(0, 1fr);
      height: 100dvh;
      overflow: hidden;
    }

    /* Left Structural Sidebar (heavier material weight) */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      border-right: 1px solid var(--border);
      padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .win-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px 14px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .traffic-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .tdot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--border-strong);
    }
    .tdot.r { background: #FF5F57; }
    .tdot.y { background: #FEBC2E; }
    .tdot.g { background: #28C840; }

    .back-link {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface-2);
    }

    .id-block {
      padding: 4px 8px 14px;
    }
    .id-name {
      font-family: var(--display);
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .id-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .id-visa {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--green);
      background: var(--green-soft);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .cmd-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      margin: 4px 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12.5px;
      cursor: pointer;
      transition: transform 100ms var(--ease-out), border-color 140ms ease;
    }
    .cmd-trigger:active { transform: scale(0.98); }
    .kbd {
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--ink-2);
      border: 1px solid var(--border);
    }

    .nav-group-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 10px 6px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      background: transparent;
      color: var(--ink-2);
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: transform 100ms var(--ease-out), background 140ms ease, color 140ms ease;
    }
    .nav-item:active { transform: scale(0.98); }
    .nav-item.active {
      background: var(--green-soft);
      color: var(--green);
    }
    .nav-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .nav-item.active .nav-count { color: var(--green); }

    @media (hover: hover) and (pointer: fine) {
      .nav-item:not(.active):hover { background: var(--surface-hover); color: var(--ink); }
      .cmd-trigger:hover { border-color: var(--border-strong); color: var(--ink); }
    }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      transition: transform 100ms var(--ease-out), background 140ms ease, border-color 140ms ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-accent {
      background: var(--green);
      color: #091311;
      border-color: transparent;
      font-weight: 700;
    }
    @media (hover: hover) and (pointer: fine) {
      .btn:not(.btn-accent):hover { background: var(--surface-hover); border-color: var(--border-strong); }
      .btn-accent:hover { filter: brightness(1.06); }
    }

    /* Main Workspace Canvas */
    .main-area {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }

    .main-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 28px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .breadcrumb .muted { color: var(--muted); font-weight: 500; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-2);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 100ms var(--ease-out), background 140ms ease;
    }
    .icon-btn:active { transform: scale(0.96); }

    .canvas-scroll {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 26px 28px 80px;
    }

    .canvas-inner {
      max-width: 1020px;
      margin: 0 auto;
    }

    /* Typography & Eyebrows (simoskill-glovo-dashboard) */
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
    }
    .h1 {
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(1.65rem, 3vw, 2.35rem);
      letter-spacing: -0.03em;
      line-height: 1.12;
      margin: 6px 0 10px;
    }
    .lede {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-2);
      margin: 0 0 22px;
      max-width: 66ch;
    }

    /* Role-Matcher Switcher */
    .matcher-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .matcher-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-right: 4px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 100ms var(--ease-out), background 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .chip:active { transform: scale(0.97); }
    .chip.active {
      background: var(--green-soft);
      color: var(--green);
      border-color: rgba(0, 194, 158, 0.35);
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .kpi-k {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .kpi-v {
      font-family: var(--display);
      font-weight: 900;
      font-size: 28px;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin: 8px 0 6px;
    }
    .kpi-v.green { color: var(--green); }
    .kpi-v.amber { color: var(--amber); }
    .kpi-v.coral { color: var(--coral); }
    .kpi-sub {
      font-size: 12.5px;
      color: var(--ink-2);
      line-height: 1.4;
    }

    /* Split Panels: Sparkline + Ranked Bars */
    .two-col {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .panel-title {
      font-family: var(--display);
      font-weight: 800;
      font-size: 15px;
      margin: 4px 0 14px;
      letter-spacing: -0.01em;
    }

    /* Breakdown Bar Rows (simoskill-glovo-dashboard) */
    .bar-row {
      display: grid;
      grid-template-columns: 122px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }
    .bar-row:last-child { border-bottom: 0; }
    .bar-track {
      height: 8px;
      border-radius: 6px;
      background: var(--surface-2);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      background: var(--green);
    }
    .bar-fill.amber { background: var(--amber); }
    .bar-fill.coral { background: var(--coral); }
    .bar-val {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 12px;
      color: var(--ink);
    }

    /* Filterable Impact Ledger Table */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    tbody tr {
      cursor: pointer;
      transition: background 120ms ease;
    }
    tbody tr.selected {
      background: var(--green-soft);
    }
    @media (hover: hover) and (pointer: fine) {
      tbody tr:hover { background: var(--surface-hover); }
    }
    tbody td {
      padding: 13px 14px;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      vertical-align: middle;
    }
    .cell-metric {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }
    .cell-metric.green { color: var(--green); }
    .cell-metric.coral { color: var(--coral); }
    .cell-metric.amber { color: var(--amber); }
    .cell-sub {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Non-blocking Translucent Right Inspector Drawer (apple-design §12) */
    .inspector {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      width: min(400px, calc(100vw - 28px));
      z-index: 60;
      background: var(--inspector-bg);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      transform: translateX(calc(100% + 24px));
      transition: transform 300ms var(--ease-out);
    }
    .inspector.open { transform: translateX(0); }
    .insp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .insp-body {
      padding: 20px 18px 26px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Cards for Case Studies, Systems, Essays */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: left;
      cursor: pointer;
      transition: transform 140ms var(--ease-out), border-color 140ms ease;
    }
    .card:active { transform: scale(0.985); }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { border-color: var(--green); }
    }

    /* Essay Split Reader */
    .essay-split {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .essay-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .essay-btn {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      transition: transform 100ms var(--ease-out), border-color 140ms ease, background 140ms ease;
    }
    .essay-btn:active { transform: scale(0.985); }
    .essay-btn.active {
      border-color: var(--green);
      background: var(--green-soft);
    }
    .essay-reader {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 30px;
    }
    .essay-reader p {
      font-size: 15.5px;
      line-height: 1.72;
      color: var(--ink-2);
      margin: 0 0 15px;
    }
    .essay-reader h3 {
      font-family: var(--display);
      font-size: 17px;
      font-weight: 800;
      margin: 24px 0 8px;
      color: var(--ink);
    }

    /* Instant Command Palette (0ms open/close per emil-design-eng — Raycast rule) */
    .cmd-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 14vh 16px 16px;
    }
    .cmd-overlay.open { display: flex; }
    .cmd-box {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
    }
    .cmd-input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
      padding: 15px 18px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }
    .cmd-results {
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
    }
    .cmd-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      font-size: 13.5px;
    }
    .cmd-item:hover, .cmd-item:focus { background: var(--surface-hover); outline: none; }

    /* Mobile iOS Bottom Tab Bar */
    .mobile-tabs {
      display: none;
    }

    @media (max-width: 920px) {
      .workbench { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-col, .card-grid, .essay-split { grid-template-columns: 1fr; }
      .main-header { padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
      .canvas-scroll { padding: 18px 16px calc(86px + env(safe-area-inset-bottom, 0px)); }
      .mobile-tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: var(--sidebar);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border-top: 1px solid var(--border);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      }
      .mtab {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        padding: 7px 4px;
        border-radius: 10px;
        cursor: pointer;
      }
      .mtab.active { color: var(--green); background: var(--green-soft); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 120ms !important; }
    }
  </style>
</head>
<body>
  <div class="workbench">
    <!-- Left Frosted macOS Sidebar -->
    <aside class="sidebar" aria-label="Workspace Navigation">
      <div class="win-controls">
        <div class="traffic-dots" aria-hidden="true">
          <span class="tdot r"></span><span class="tdot y"></span><span class="tdot g"></span>
        </div>

      // Inline SVG Trend Chart (Glovo SMB Ads % of fGMV Jan-Oct 2026)
      function renderAdsSparkline() {
        const pts = [
          { m: "Jan", v: 2.97 }, { m: "Feb", v: 3.79 }, { m: "Mar", v: 3.17 },
          { m: "Apr", v: 3.86 }, { m: "May", v: 3.69 }, { m: "Jun", v: 4.05 },
          { m: "Jul", v: 4.41 }, { m: "Aug", v: 4.89 }, { m: "Sep", v: 4.59 },
          { m: "Oct", v: 5.03 }
        ];
        const W = 460, H = 165, PL = 28, PR = 14, PT = 18, PB = 26;
        const cW = W - PL - PR, cH = H - PT - PB;
        const step = cW / (pts.length - 1);
        const yFor = v => PT + cH - ((v - 2.4) / (5.4 - 2.4)) * cH;
        const coords = pts.map((p, i) => `${PL + i * step},${yFor(p.v).toFixed(1)}`).join(" ");
        const area = `${PL},${PT + cH} ${coords} ${PL + (pts.length - 1) * step},${PT + cH}`;
        return `
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" aria-label="Glovo Nigeria SMB Ads % of Food GMV Jan to Oct 2026">
            <polygon points="${area}" fill="rgba(0,194,158,0.12)" />
            <polyline points="${coords}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" />
            ${pts.map((p, i) => {
              const x = PL + i * step, y = yFor(p.v);
              const showVal = i === 0 || i === pts.length - 1;
              return `
                <circle cx="${x}" cy="${y}" r="${showVal ? 4 : 2.5}" fill="var(--green)" />
                ${showVal ? `<text x="${x}" y="${y - 9}" text-anchor="${i === 0 ? "start" : "end"}" fill="var(--ink)" font-family="JetBrains Mono" font-size="11" font-weight="700">${p.v.toFixed(1)}%</text>` : ""}
                <text x="${x}" y="${H - 6}" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono" font-size="10">${p.m}</text>
              `;
            }).join("")}
          </svg>
        `;
      }

      const cmdOverlay = document.getElementById("cmdOverlay");
      const cmdInput = document.getElementById("cmdInput");
      const cmdResults = document.getElementById("cmdResults");

      const cmdItems = [
        ...D.roles.map(r => ({ label: `${r.company} — ${r.role}`, meta: "Case Study", search: `${r.company} ${r.role} ${r.summary}`.toLowerCase(), run: () => { activeView = "cases"; renderView(); inspectRole(r.id); } })),
        ...D.systemsBuilt.map(s => ({ label: `${s.title} (${s.headlineMetric})`, meta: "AI / Tool", search: `${s.title} ${s.stack.join(" ")} ${s.problem}`.toLowerCase(), run: () => { activeView = "systems"; renderView(); inspectSystem(s.id); } })),
        ...D.essays.map(e => ({ label: e.title, meta: "Essay", search: `${e.title} ${e.topic} ${e.excerpt}`.toLowerCase(), run: () => { activeView = "essays"; activeEssayId = e.id; renderView(); } })),
        { label: "Impact Ledger — Filter all 18 verified wins", meta: "View", search: "ledger metrics fintech saas marketplace retention fraud", run: () => { activeView = "ledger"; renderView(); } },
        { label: "UK Global Talent Visa & Contact", meta: "Credentials", search: "uk visa sponsorship contact email linkedin cv resume", run: () => { activeView = "contact"; renderView(); } },
        { label: "Open Executive CV (Print / Save PDF)", meta: "CV", search: "cv resume pdf download", run: () => window.open("../assets/cv.html", "_blank") }
      ];

      function renderCmd(q) {
        const term = (q || "").trim().toLowerCase();
        const matches = term ? cmdItems.filter(i => i.search.includes(term) || i.label.toLowerCase().includes(term)) : cmdItems.slice(0, 8);
        cmdResults.innerHTML = matches.length ? matches.map((m, idx) => `
          <button class="cmd-item" type="button" data-cmd-idx="${cmdItems.indexOf(m)}">
            <span>${m.label}</span>
            <span class="kbd">${m.meta}</span>
          </button>
        `).join("") : `<div style="padding:14px;font-size:13px;color:var(--muted);">No matching records for "${q}".</div>`;
      }

      function openCmd() {
        cmdOverlay.classList.add("open");
        cmdOverlay.setAttribute("aria-hidden", "false");
        cmdInput.value = "";
        renderCmd("");
        cmdInput.focus();
      }
      function closeCmd() {
        cmdOverlay.classList.remove("open");
        cmdOverlay.setAttribute("aria-hidden", "true");
      }

      // Global Event Delegation
      document.addEventListener("click", (e) => {
        const vBtn = e.target.closest("[data-view]");
        if (vBtn) { activeView = vBtn.dataset.view; closeInspector(); renderView(); return; }
        const mBtn = e.target.closest("[data-matcher]");
        if (mBtn) { matcherLens = mBtn.dataset.matcher; renderView(); return; }
        const iBtn = e.target.closest("[data-ind]");
        if (iBtn) { ledgerIndustry = iBtn.dataset.ind; renderView(); return; }
        const rCard = e.target.closest("[data-inspect-role]");
        if (rCard) { inspectRole(rCard.dataset.inspectRole); return; }
        const sCard = e.target.closest("[data-inspect-sys]");
        if (sCard) { inspectSystem(sCard.dataset.inspectSys); return; }
        const lRow = e.target.closest("[data-ledger-idx]");
        if (lRow) { inspectLedger(Number(lRow.dataset.ledgerIdx)); return; }
        const ePick = e.target.closest("[data-pick-essay]");
        if (ePick) { activeEssayId = ePick.dataset.pickEssay; renderView(); return; }
        const cItem = e.target.closest("[data-cmd-idx]");
        if (cItem) { const item = cmdItems[Number(cItem.dataset.cmdIdx)]; closeCmd(); if (item) item.run(); return; }
      });

      document.getElementById("inspClose").addEventListener("click", closeInspector);
      document.getElementById("openCmd").addEventListener("click", openCmd);
      document.getElementById("cmdBtnTop").addEventListener("click", openCmd);
      cmdOverlay.addEventListener("click", (e) => { if (e.target === cmdOverlay) closeCmd(); });
      cmdInput.addEventListener("input", () => renderCmd(cmdInput.value));

      document.getElementById("themeToggle").addEventListener("click", (e) => {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        e.target.textContent = next === "dark" ? "Light Mode" : "Dark Mode";
        document.getElementById("themeMeta").setAttribute("content", next === "dark" ? "#141517" : "#F5F5F7");
      });

      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          cmdOverlay.classList.contains("open") ? closeCmd() : openCmd();
        } else if (e.key === "Escape") {
          closeCmd();
          closeInspector();
        }
      });

      renderView();
    })();
  </script>
</body>
</html>
